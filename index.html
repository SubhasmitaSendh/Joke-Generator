<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Joke Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Neon Animated Lines -->

    <div class="line line1"></div>
    <div class="line line2"></div>


    <!-- Main Container -->

    <div class="container">

        <div class="top-bar">

            <h1>😂 Joke Generator</h1>

            <button id="themeBtn">🌙</button>

        </div>

        <!-- Joke Box -->

        <div class="joke-box">

            <p id="joke">
                Click Generate to get a joke 😂
            </p>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button id="generateBtn">
                ✨ Generate
            </button>

            <button id="copyBtn">
                📋 Copy
            </button>

            <button id="voiceBtn">
                🔊 Speak
            </button>

            <button id="favBtn">
                ❤️ Favorite
            </button>


        </div>

        <!-- Favorite Jokes -->

        <div class="favorites">

            <h2>⭐ Favorite Jokes</h2>

            <ul id="favList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
